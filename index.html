<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1117;
  color: white;
}

.app {
  max-width: 850px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 18px;
  border-bottom: 1px solid #292d38;
}

header h2 {
  margin: 0;
}

#setup {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-bottom: 1px solid #292d38;
}

input,
textarea {
  background: #191c25;
  color: white;
  border: 1px solid #343947;
  border-radius: 10px;
  padding: 12px;
}

#key {
  flex: 1;
}

button {
  background: #6d5dfc;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 80%;
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 15px;
  white-space: pre-wrap;
  line-height: 1.5;
}

.user {
  background: #292d3a;
  margin-left: auto;
}

.ai {
  background: #191c25;
  border: 1px solid #292d38;
}

#composer {
  display: flex;
  gap: 10px;
  padding: 15px;
  border-top: 1px solid #292d38;
}

#prompt {
  flex: 1;
  resize: none;
  height: 50px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h2>✦ Gemini Chat</h2>
</header>

<div id="setup">
  <input
    id="apiKey"
    type="password"
    placeholder="Gemini API-Key hier einfügen"
  >
  <button onclick="saveKey()">Speichern</button>
</div>

<div id="messages">
  <div class="message ai">
    👋 Gib deinen Gemini API-Key ein und starte den Chat.
  </div>
</div>

<div id="composer">
  <textarea
    id="prompt"
    placeholder="Nachricht schreiben..."
    disabled
  ></textarea>

  <button id="send" onclick="sendMessage()" disabled>
    Senden
  </button>
</div>

</div>

<script>

let API_KEY = "";

function saveKey() {

  API_KEY = document
    .getElementById("apiKey")
    .value
    .trim();

  if (!API_KEY) {
    alert("Bitte einen API-Key eingeben.");
    return;
  }

  document.getElementById("prompt").disabled = false;
  document.getElementById("send").disabled = false;

  addMessage(
    "API-Key gespeichert. 🚀 Schreib mir etwas!",
    "ai"
  );
}


function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  document
    .getElementById("messages")
    .appendChild(message);

  document.getElementById("messages").scrollTop =
    document.getElementById("messages").scrollHeight;

  return message;
}


async function sendMessage() {

  const input = document.getElementById("prompt");

  const text = input.value.trim();

  if (!text || !API_KEY) return;

  addMessage(text, "user");

  input.value = "";

  const loading = addMessage(
    "Gemini denkt …",
    "ai"
  );

  document.getElementById("send").disabled = true;

  try {

    const model = "gemini-2.5-flash";

    const url =
      "https://generativelanguage.googleapis.com/" +
      "v1beta/models/" +
      model +
      ":generateContent?key=" +
      encodeURIComponent(API_KEY);

    const response = await fetch(url, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        contents: [
          {
            parts: [
              {
                text: text
              }
            ]
          }
        ]

      })

    });

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data?.error?.message ||
        "Gemini API Fehler"
      );

    }

    const answer =
      data?.candidates?.[0]
        ?.content?.parts
        ?.map(part => part.text || "")
        .join("") ||
      "Keine Antwort erhalten.";

    loading.textContent = answer;

  } catch (error) {

    loading.textContent =
      "❌ Fehler: " + error.message;

  }

  document.getElementById("send").disabled = false;

  input.focus();
}


document
  .getElementById("prompt")
  .addEventListener("keydown", function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  });

</script>

</body>
</html>
